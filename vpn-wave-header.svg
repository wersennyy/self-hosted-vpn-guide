<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1920" height="600" fill="url(#bg)"/>
  <rect width="1920" height="600" fill="url(#grid)" opacity="0.4"/>
  
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#333333" stroke-width="1" opacity="0.6"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="#333333" stroke-width="1" opacity="0.6"/>
  
  <circle cx="960" cy="300" r="150" fill="none" stroke="#404040" stroke-width="2" opacity="0.3"/>
  <circle cx="960" cy="300" r="100" fill="none" stroke="#404040" stroke-width="2" opacity="0.5"/>
  <circle cx="960" cy="300" r="50" fill="none" stroke="#505050" stroke-width="2" opacity="0.7"/>
</svg>
