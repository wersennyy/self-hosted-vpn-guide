  <text
    x="140"
    y="295"
    fill="#e5e7eb"
    font-family="Georgia, serif"
    font-size="17"
  >компьютерными сетями, кибербезопасностью и программированием.</text>

  <!-- Текст, абзац 2 -->
  <text
    x="140"
    y="340"
    fill="#c9d1d9"
    font-family="Arial, Helvetica, sans-serif"
