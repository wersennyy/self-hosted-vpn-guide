<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 750">
  <defs>
    <linearGradient id="sidebarDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f38"/>
      <stop offset="100%" stop-color="#061526"/>
    </linearGradient>

    <linearGradient id="fadeToGitHub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="0.02"/>
      <stop offset="66%" stop-color="#0d1117" stop-opacity="0.32"/>
      <stop offset="84%" stop-color="#0d1117" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Тёмно-синий фон -->
  <rect width="1460" height="750" fill="#051020"/>

  <!-- Сайдбар -->
  <rect width="520" height="750" fill="url(#sidebarDark)"/>

  <!-- Лёгкий fade поверх всего -->
  <rect width="1460" height="750" fill="url(#fadeToGitHub)"/>

  <!-- Декоративная вертикальная линия -->
  <rect x="110" y="140" width="4" height="260" fill="#159fba" opacity="0.9"/>

  <!-- Заголовок -->
  <text
    x="140"
    y="210"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="800"
