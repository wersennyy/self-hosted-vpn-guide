<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент в стиле шапки -->
    <linearGradient id="aboutGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Свечение -->
    <filter id="aboutGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Фоновая сетка -->
    <pattern id="aboutGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="1200" height="200" fill="#0d1117"/>

  <!-- Сетка -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#aboutGrid)"/>

  <!-- Декоративные линии -->
  <g stroke="url(#aboutGrad)" stroke-width="1.2" opacity="0.25">
    <path d="M 0 50 L 1200 50"/>
    <path d="M 0 100 L 1200 100"/>
    <path d="M 0 150 L 1200 150"/>
  </g>

  <!-- Анимированные «волны» / узлы -->
  <g fill="url(#aboutGrad)" opacity="0.18" filter="url(#aboutGlow)">
    <circle cx="250" cy="100" r="40">
      <animate attributeName="r" values="30;48;30" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.25;0.12" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="100" r="50">
      <animate attributeName="r" values="40;60;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.22;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="100" r="45">
      <animate attributeName="r" values="35;55;35" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.23;0.1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="100" r="38">
      <animate attributeName="r" values="28;46;28" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.24;0.12" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Соединительные линии -->
  <g stroke="url(#aboutGrad)" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M 250 100 L 500 100"/>
    <path d="M 500 100 L 750 100"/>
    <path d="M 750 100 L 950 100"/>
  </g>

  <!-- Иконка «проект / документ» -->
  <g transform="translate(470,55)" fill="none" stroke="url(#aboutGrad)" stroke-width="2.2" filter="url(#aboutGlow)">
    <rect x="0" y="0" width="260" height="90" rx="10"/>
    <path d="M 40 25 L 220 25"/>
    <path d="M 40 45 L 220 45"/>
    <path d="M 40 65 L 180 65"/>
    <circle cx="235" cy="70" r="4" fill="url(#aboutGrad)"/>
  </g>

  <!-- Подпись -->
  <text x="600" y="185" font-family="Segoe UI, Roboto, Arial" font-size="20" fill="#93c5fd" text-anchor="middle" opacity="0.95">
    О проекте
  </text>
</svg>
